# Gruvbox Dark theme, matching the tmux-gruvbox setup

format = """
[](fg:bg1)$os$username[](bg:bg2 fg:bg1)$directory[](fg:bg2 bg:bg3)$git_branch$git_status[](fg:bg3)
$character"""

palette = "gruvbox_dark"

[palettes.gruvbox_dark]
bg0 = "#282828"
bg1 = "#3c3836"
bg2 = "#504945"
bg3 = "#665c54"
fg = "#ebdbb2"
red = "#fb4934"
green = "#b8bb26"
yellow = "#fabd2f"
blue = "#83a598"
purple = "#d3869b"
aqua = "#8ec07c"
orange = "#fe8019"
gray = "#928374"

[os]
disabled = false
style = "bg:bg1 fg:fg"
format = "[ $symbol ]($style)"

[os.symbols]
Macos = "󰀵"

[username]
show_always = false
style_user = "bg:bg1 fg:fg"
style_root = "bg:bg1 fg:red"
format = "[$user ]($style)"

[directory]
style = "bg:bg2 fg:fg"
format = "[ $path ]($style)"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "bg:bg3 fg:fg"
format = "[ $symbol $branch ]($style)"

[git_status]
style = "bg:bg3 fg:yellow"
format = "[$all_status$ahead_behind ]($style)"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[cmd_duration]
min_time = 2000
format = "took [$duration](bold yellow) "

[time]
disabled = false
time_format = "%R"
style = "fg:gray"
format = "[$time]($style)"
